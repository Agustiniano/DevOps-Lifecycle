apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    # For cert-manager (uncomment when ready)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  rules:
  - host: argocd.local  # CHANGE THIS to your domain (e.g., argocd.yourdomain.com)
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              name: https
  # Uncomment when you have SSL certs
  # tls:
  # - hosts:
  #   - argocd.yourdomain.com
  #   secretName: argocd-server-tls
---
# Alternative: Ingress without SSL passthrough (terminates SSL at ingress)
# Uncomment this and comment the above if you prefer SSL termination at ingress level
