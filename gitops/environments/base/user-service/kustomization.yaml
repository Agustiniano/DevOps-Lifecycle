apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - deployment.yaml
  - ingress.yaml
  # ServiceMonitor depends on Prometheus Operator CRDs. Kept enabled but ArgoCD
  # will wait for the operator because `user-service-prod` depends on it.
  - servicemonitor.yaml

labels:
  - pairs:
      app: user-service
      managed-by: argocd
      environment: production

configMapGenerator:
  - name: user-service-config
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=8080

images:
  - name: ghcr.io/agustiniano/user-service
    newTag: latest
