apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - deployment.yaml
  # Uncomment when Prometheus Operator is installed:
  # - servicemonitor.yaml

commonLabels:
  app: user-service
  managed-by: argocd
  environment: production

configMapGenerator:
  - name: user-service-config
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=8080

images:
  - name: harbor.acme.com/platform/user-service
    newTag: v1.0.0
