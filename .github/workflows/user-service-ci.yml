name: user-service-ci

on:
  push:
    branches: [ "main" ]
    paths:
      - "applications/microservices/user-service/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        working-directory: applications/microservices/user-service
        run: |
          USER_LC="${{ github.repository_owner }}"
          USER_LC="${USER_LC,,}"
          IMAGE_BASE="ghcr.io/${USER_LC}/user-service"
          IMAGE_SHA="${IMAGE_BASE}:${GITHUB_SHA}"
          IMAGE_LATEST="${IMAGE_BASE}:latest"
          
          echo "Building ${IMAGE_SHA}"
          docker buildx build \
            --build-arg VERSION="${GITHUB_REF_NAME}" \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --platform linux/amd64 \
            --push \
            -t "${IMAGE_SHA}" \
            -t "${IMAGE_LATEST}" \
            .

      - name: Update GitOps manifests
        run: |
          USER_LC="${{ github.repository_owner }}"
          USER_LC="${USER_LC,,}"
          IMAGE="ghcr.io/${USER_LC}/user-service:${GITHUB_SHA}"

          # instalar yq
          curl -L https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

          cd gitops/environments/overlays/production/user-service

          # Asegurarse de que el bloque images exista y esté en lowercase
          yq -i ".images[0].name = \"ghcr.io/${USER_LC}/user-service\"" kustomization.yaml || true
          yq -i ".images[0].newTag = \"${GITHUB_SHA}\"" kustomization.yaml || true

          cd -  # volver a la raíz del repo

          git config user.name "ciclovida-bot"
          git config user.email "ciclovida-bot@example.com"

          git status
          git commit -am "chore: deploy user-service ${GITHUB_SHA}" || echo "No changes"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Agustiniano/DevOps-Lifecycle.git"
